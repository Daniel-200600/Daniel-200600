name: Coding time

on:
  schedule:
    - cron: "30 23 * * *" # chaque nuit, 00:30 heure du Cameroun
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats WakaTime dans le README du profil
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SECTION_NAME: waka
          SHOW_TITLE: true
          SHOW_TIME: true
          TIME_RANGE: last_7_days
          LANG_COUNT: 5
          COMMIT_MESSAGE: "Mise à jour des stats WakaTime"

      - name: Récupérer le commit des stats
        run: git pull --rebase

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Journal de travail
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WORK_LOG_HIDE: ${{ vars.WORK_LOG_HIDE }}
        run: python scripts/update_work_log.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work-log
          git diff --cached --quiet || git commit -m "Journal de travail : $(date -u +%F)"
          git push
